name: Vitruvius Research Index

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-002/vitruvius-automation-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Vitruvius index
        run: python scripts/vitruvius_automation_engine.py --write
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitruvius/VITRUVIUS_INDEX.json vitruvius/VITRUVIUS_WORK_QUEUE.json
          git diff --cached --quiet || git commit -m "vitruvius: refresh research index"
          git push origin HEAD:agent/codex-002/vitruvius-automation-engine
