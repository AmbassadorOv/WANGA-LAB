name: Vitruvius Branch Fabric - Global Neural Network

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  branch-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build scalable logical branch fabric
        run: python scripts/vitruvius_branch_fabric.py --write
      - name: Test branch fabric
        run: python -m pytest tests/test_vitruvius_branch_fabric.py
      - uses: actions/upload-artifact@v4
        with:
          name: wanga-branch-fabric
          path: vitruvius/GITHUB_BRANCH_FABRIC_STATE.json
