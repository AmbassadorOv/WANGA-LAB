name: Global Drift Network — Daily White Paper Run

on:
  schedule:
    # 17:00 UTC is the configured daily target corresponding to 20:00 Asia/Jerusalem
    # for the current schedule configuration. Review when DST rules change.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-drift-whitepaper-daily
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deterministic pipeline
        run: python3 ai-drift-forensics/global-drift-network/whitepaper-prep/runtime/daily_run.py

      - name: Upload runtime state
        uses: actions/upload-artifact@v4
        with:
          name: global-drift-whitepaper-state-${{ github.run_id }}
          path: ai-drift-forensics/global-drift-network/whitepaper-prep/state/
          if-no-files-found: error
          retention-days: 30

      - name: Commit state evidence
        run: |
          git config user.name 'Global Drift Network Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-drift-forensics/global-drift-network/whitepaper-prep/state/
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'chore: record daily white paper pipeline state'
            git push
          fi
