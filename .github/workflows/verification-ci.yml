name: Imperial Audit Evidence Verification

on:
  push:
    paths:
      - "imperial-audit-core/**"
      - ".github/workflows/verification-ci.yml"
  pull_request:
    paths:
      - "imperial-audit-core/**"
      - ".github/workflows/verification-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imperial-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=. python -m pytest -q
      - name: End-to-end hash-chain smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          from src.crypto.sha256_chain import build_chain, verify_chain

          audit = build_chain({"x": 1}, {"y": 2}, {"z": 3}, "2026-01-01T00:00:00Z")
          assert verify_chain(
              {"x": 1}, {"y": 2}, {"z": 3},
              "2026-01-01T00:00:00Z",
              audit,
          )

          changed = build_chain({"x": 1}, {"y": 2}, {"z": 4}, "2026-01-01T00:00:00Z")
          assert audit["MASTER_CHAIN_HASH"] != changed["MASTER_CHAIN_HASH"]
          print("IMPERIAL_AUDIT_VERIFICATION=PASS")
          PY
