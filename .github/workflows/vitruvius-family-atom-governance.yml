name: Vitruvius Family Atom Neural Governance Map

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python scripts/vitruvius_family_atom_mapper.py
      - run: python -m pytest tests/test_vitruvius_family_atom_mapper.py
      - uses: actions/upload-artifact@v4
        with:
          name: family-atom-neural-graph
          path: vitruvius/TEN_ARCHITECTURE_FAMILY_ATOM_NEURAL_GRAPH_V1.json
