name: Vitruvius Connector Discovery

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Write discovery report"
        required: false
        default: "true"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Vitruvius connector discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/vitruvius_connector_engine.py --write --min-score 6
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: vitruvius-connector-discovery
          path: vitruvius/CONNECTOR_DISCOVERY_REPORT.json
