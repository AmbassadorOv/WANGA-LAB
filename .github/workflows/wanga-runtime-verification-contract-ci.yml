name: WANGA Runtime Verification Contract CI

on:
  pull_request:
    paths:
      - 'wanga_runtime/**'
      - 'tests/test_wanga_runtime_verification_contract.py'
      - '.github/workflows/wanga-runtime-verification-contract-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'wanga_runtime/**'
      - 'tests/test_wanga_runtime_verification_contract.py'
      - '.github/workflows/wanga-runtime-verification-contract-ci.yml'

permissions:
  contents: read

jobs:
  runtime-verification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q wanga_runtime tests/test_wanga_runtime_verification_contract.py
      - name: Verification contract tests
        run: python -m unittest -v tests.test_wanga_runtime_verification_contract
