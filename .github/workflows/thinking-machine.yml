name: Thinking Machine Recursive Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: thinking-machine-recursive-builder
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate next layers
        env:
          ANTHROPIC_API_KEY: \${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: \${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: \${{ vars.ANTHROPIC_MODEL }}
        run: |
          python thinking-machine/runtime.py

      - name: Commit accepted layers and registry updates
        run: |
          git config user.name "thinking-machine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thinking-machine/layers thinking-machine/agents thinking-machine/state/state.json
          if git diff --cached --quiet; then
            echo "No accepted changes."
            exit 0
          fi
          git commit -m "thinking-machine: promote governed topology and agents"
          git push
