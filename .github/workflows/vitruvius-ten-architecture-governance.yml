name: Vitruvius Ten Architecture Neural Governance Map
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "57 * * * *"
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python scripts/vitruvius_ten_architecture_family_mapper.py
      - run: python -m pytest tests/test_vitruvius_ten_architecture_family_mapper.py
      - uses: actions/upload-artifact@v4
        with:
          name: ten-architecture-neural-governance-map
          path: vitruvius/TEN_ARCHITECTURE_NEURAL_GOVERNANCE_GRAPH_V1.json
