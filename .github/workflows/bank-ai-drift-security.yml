name: Bank AI Drift Forensics Security Run

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "ai-drift-forensics/**"
      - "tools/**"
      - "tests/**"
      - "artifacts/drift-known-risk-001/**"
      - ".github/workflows/bank-ai-drift-security.yml"

permissions:
  contents: read

jobs:
  drift-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WANGA-LAB
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip pytest

      - name: Compile security and forensic code
        run: python -m compileall -q ai-drift-forensics tools tests scripts

      - name: Run insurer intake and forensic verification
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_insurer_intake.py \
            tests/test_insurer_pipeline.py \
            tests/test_insurer_oversight.py \
            tests/test_insurer_case_queue.py

      - name: Replay known-risk forensic fixture
        run: python tools/replay_known_risk.py

      - name: Verify forensic result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/drift-known-risk-001/outputs/replay-result.json")
          data = json.loads(p.read_text())

          assert data["case_ref"] == "CASE_REF_2026_DRIFT_KNOWN_RISK_001"
          assert data["fixture"] == "synthetic"
          assert data["deviation_detected"] is True
          assert data["drift_type"] == "CRITERION_DRIFT"
          assert len(data["hashes"]["baseline_criterion_sha256"]) == 64
          assert len(data["hashes"]["observed_criterion_sha256"]) == 64

          print("BANK_AI_DRIFT_FORENSICS=PASS")
          print(f"CASE_REF={data['case_ref']}")
          print(f"DRIFT_TYPE={data['drift_type']}")
          PY

      - name: Build machine-readable security run manifest
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          replay = json.loads(
              Path("artifacts/drift-known-risk-001/outputs/replay-result.json").read_text()
          )

          manifest = {
              "run_type": "BANK_AI_DRIFT_FORENSICS",
              "status": "PASS",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "case_ref": replay["case_ref"],
              "fixture": replay["fixture"],
              "drift_type": replay["drift_type"],
              "deviation_detected": replay["deviation_detected"],
              "evidence": {
                  "baseline_criterion_sha256": replay["hashes"]["baseline_criterion_sha256"],
                  "observed_criterion_sha256": replay["hashes"]["observed_criterion_sha256"],
              },
              "scope_note": "Synthetic forensic fixture; not a live bank investigation."
          }

          Path("bank-ai-drift-security-run.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY

      - name: Upload forensic security run
        uses: actions/upload-artifact@v4
        with:
          name: bank-ai-drift-security-run
          path: bank-ai-drift-security-run.json
          retention-days: 30
