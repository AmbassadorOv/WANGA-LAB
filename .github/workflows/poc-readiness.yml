name: POC Readiness Audit
on:
  push:
    branches: [main, poc-autonomous-build]
  pull_request:
    branches: [main, poc-autonomous-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -q pytest psutil
      - name: Run readiness audit
        run: python tools/poc_readiness_auditor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-readiness-report
          path: POC_READINESS_REPORT.json
