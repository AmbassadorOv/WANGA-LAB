name: WANGA Hourly Global Manager Cycle

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wanga-global-manager-hourly
  cancel-in-progress: false

jobs:
  manager-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: autobuild/architecture-construction
          fetch-depth: 0

      - name: Run global manager cycle
        run: |
          python scripts/global_work_manager.py

      - name: Run manager tests
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_global_work_manager.py'

      - name: Detect actionable state
        id: action
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p="docs/GLOBAL_WORK_PLAN.json"
          actionable=False
          if os.path.exists(p):
              d=json.load(open(p, encoding="utf-8"))
              tasks=d.get("tasks", [])
              actionable=any(t.get("status") in {"READY","RUNNING","REVIEW_REQUIRED","BLOCKED","CONFLICT"} for t in tasks)
          print(f"actionable={str(actionable).lower()}")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"actionable={str(actionable).lower()}\n")
          PY

      - name: Commit manager state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GLOBAL_WORK_PLAN.json docs/WORK_MEMORY_STATE.json
          git diff --cached --quiet || git commit -m "chore: checkpoint hourly global manager state"
          git push origin autobuild/architecture-construction

      - name: Publish manager signal
        if: steps.action.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "GLOBAL MANAGER ACTION REQUIRED — ${{ github.run_id }}"             --body "Hourly global-manager cycle detected actionable work. Review docs/GLOBAL_WORK_PLAN.json and docs/WORK_MEMORY_STATE.json. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"             --label "global-manager"
