name: WANGA Architecture Discovery Scouts

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wanga-autonomous-build
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: autobuild/architecture-construction
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run three architecture scout tracks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/architecture-discovery/raw
          queries=(
            "ARCH-01|agent orchestration workflow engine distributed control plane"
            "ARCH-02|multi agent memory planning model routing evaluation"
            "ARCH-03|AI verification provenance observability runtime security open source"
          )
          for item in "${queries[@]}"; do
            agent="${item%%|*}"
            query="${item#*|}"
            gh api --paginate search/repositories -f q="${query}" -f per_page=30               > "docs/architecture-discovery/raw/${agent}.json"
          done

      - name: Validate discovery contracts
        run: |
          python -m compileall -q scripts
          python scripts/architecture_discovery.py
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("docs/architecture-discovery/raw").glob("*.json"):
              data=json.loads(p.read_text(encoding="utf-8"))
              assert "items" in data or isinstance(data, list)
          print("ARCHITECTURE_DISCOVERY_RAW: valid")
          PY

      - name: Commit discovery evidence
        run: |
          git config user.name "wanga-architecture-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-discovery docs/ARCHITECTURE_DISCOVERY_REGISTRY.json
          if ! git diff --cached --quiet; then
            git commit -m "autobuild: collect architecture discovery evidence"
            git push origin autobuild/architecture-construction
          fi
