name: Regional Drift Agents

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  reg-us:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: "REG-US"
      DRIFT_LANGUAGE: "en"
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_US }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_US }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect probes
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - name: Commit observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-drift-forensics/global-drift-network/data/regional-observations/
          git diff --cached --quiet || git commit -m "data: regional drift observation (REG-US)"
          git push

