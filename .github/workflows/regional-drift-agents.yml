name: Regional Drift Agents

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  reg-us:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-US
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_US }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_US }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-US, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  reg-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-EU
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_EU }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_EU }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-EU, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  reg-il-me:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-IL-ME
      DRIFT_LANGUAGE: he
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_IL_ME }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_IL_ME }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-IL-ME, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  reg-sa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-SA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_SA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_SA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-SA, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  reg-ea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-EA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_EA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_EA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-EA, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  reg-latam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-LATAM
      DRIFT_LANGUAGE: es
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_LATAM }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_LATAM }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-LATAM, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  reg-oceania:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-OCEANIA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_OCEANIA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_OCEANIA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-OCEANIA, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  reg-africa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-AFRICA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_AFRICA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_AFRICA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with: {name: regional-REG-AFRICA, path: ai-drift-forensics/global-drift-network/data/regional-observations/}

  publish-observations:
    needs: [reg-us, reg-eu, reg-il-me, reg-sa, reg-ea, reg-latam, reg-oceania, reg-africa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: regional-*
          path: /tmp/regional
      - name: Collect observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-drift-forensics/global-drift-network/data/regional-observations
          find /tmp/regional -type f -name '*.json' -exec cp {} ai-drift-forensics/global-drift-network/data/regional-observations/ \;
      - name: Commit observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-drift-forensics/global-drift-network/data/regional-observations/
          git diff --cached --quiet || git commit -m "data: regional drift observation batch"
          git push
