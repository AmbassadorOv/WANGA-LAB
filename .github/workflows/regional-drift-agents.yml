name: Regional Drift Agents

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: REG-US
            language: en
            endpoint_secret: DRIFT_ENDPOINT_US
            token_secret: DRIFT_TOKEN_US
          - node: REG-EU
            language: en
            endpoint_secret: DRIFT_ENDPOINT_EU
            token_secret: DRIFT_TOKEN_EU
          - node: REG-IL-ME
            language: he
            endpoint_secret: DRIFT_ENDPOINT_IL_ME
            token_secret: DRIFT_TOKEN_IL_ME
          - node: REG-SA
            language: en
            endpoint_secret: DRIFT_ENDPOINT_SA
            token_secret: DRIFT_TOKEN_SA
          - node: REG-EA
            language: en
            endpoint_secret: DRIFT_ENDPOINT_EA
            token_secret: DRIFT_TOKEN_EA
          - node: REG-LATAM
            language: es
            endpoint_secret: DRIFT_ENDPOINT_LATAM
            token_secret: DRIFT_TOKEN_LATAM
          - node: REG-OCEANIA
            language: en
            endpoint_secret: DRIFT_ENDPOINT_OCEANIA
            token_secret: DRIFT_TOKEN_OCEANIA
          - node: REG-AFRICA
            language: en
            endpoint_secret: DRIFT_ENDPOINT_AFRICA
            token_secret: DRIFT_TOKEN_AFRICA
    env:
      DRIFT_NODE: ${{ matrix.node }}
      DRIFT_LANGUAGE: ${{ matrix.language }}
      DRIFT_ENDPOINT: ${{ secrets[matrix.endpoint_secret] }}
      DRIFT_TOKEN: ${{ secrets[matrix.token_secret] }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect probes
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - name: Commit observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-drift-forensics/global-drift-network/data/regional-observations/
          git diff --cached --quiet || git commit -m "data: regional drift observation"
          git push
