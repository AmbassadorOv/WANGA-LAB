name: Imperial Audit Android Build
on:
  push:
    paths:
      - "imperial-audit-core/android/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imperial-audit-core/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imperial-audit-debug-apk
          path: imperial-audit-core/android/app/build/outputs/apk/debug/app-debug.apk
