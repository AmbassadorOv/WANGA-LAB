[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-holographic-string-nn"
version = "0.1.0"
description = "Research implementation of the 22-node Holographic String Neural Network weighting model."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
